<!DOCTYPE html>
<html lang="en">
<head>

    <title>Project | BIOMOD 2026 Team Science Tokyo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="bg-white text-dark" data-bs-spy="scroll" data-bs-target="#page-nav" data-bs-smooth-scroll="true" tabindex="0">

    <main class="container px-3 px-md-0" style="max-width: 1100px; padding-top: 80px; padding-bottom: 100px;">
        
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-custom-blue tracking-widest">PROJECT</h1>
        </div>

        <div class="row gx-5">
            <!-- 左側：追従する目次（PCのみ表示） -->
            <div class="col-lg-3 d-none d-lg-block">
                <nav id="page-nav" class="nav flex-column sticky-top" style="top: 100px;">
                    <a class="nav-link custom-link fw-bold" href="#background">Background</a>
                    <a class="nav-link custom-link fw-bold" href="#design">Design</a>
                    <a class="nav-link custom-link fw-bold" href="#results">Results</a>
                    <a class="nav-link custom-link fw-bold" href="#discussion">Discussion</a>
                </nav>
            </div>

            <!-- 右側：メインコンテンツ -->
            <div class="col-lg-9">
                
                <section id="background" class="fade-in-section mb-5 pt-4">
                    <h2 class="h3 fw-bold text-custom-blue mb-4 pb-2 border-bottom border-secondary-subtle">Background</h2>
                    <p class="fs-6 text-secondary mb-3" style="line-height: 1.9;">

                    </p>
                    <!-- 画像のプレースホルダー -->
                    <div class="bg-light border rounded-3 d-flex justify-content-center align-items-center mb-3" style="height: 300px;">

                    </div>

                    <h2 class="h3 fw-bold text-custom-blue mb-4 pb-2 border-bottom border-secondary-subtle">Design</h2>
                    <p class="fs-6 text-secondary mb-3" style="line-height: 1.9;">
                        [設計情報のテキスト]
                    </p>
                </section>

                <section id="results" class="fade-in-section mb-5 pt-4">
                    <h2 class="h3 fw-bold text-custom-blue mb-4 pb-2 border-bottom border-secondary-subtle">Results</h2>
                    <p class="fs-6 text-secondary mb-3" style="line-height: 1.9;">
                        [実験結果のテキスト]
                    </p>
                </section>

                <section id="discussion" class="fade-in-section mb-5 pt-4">
                    <h2 class="h3 fw-bold text-custom-blue mb-4 pb-2 border-bottom border-secondary-subtle">Discussion & Future Works</h2>
                    <p class="fs-6 text-secondary mb-3" style="line-height: 1.9;">
                        [考察・今後の展望のテキスト]
                    </p>
                </section>

            </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
