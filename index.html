<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIOMOD 2026 | Team Science Tokyo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダー読み込み位置 -->
    <div id="header-placeholder"></div>

    <!-- ヒーローセクション -->
    <header class="position-relative" style="margin-top: -60px; height: 80vh; min-height: 500px; background-color: var(--primary-blue); overflow: hidden;">
        <!-- 背景の装飾（DNAをイメージしたグラデーション） -->
        <div class="position-absolute w-100 h-100" style="background: radial-gradient(circle at right, rgba(127, 150, 194, 0.3) 0%, var(--primary-blue) 70%);"></div>
        
        <div class="position-absolute top-50 start-50 translate-middle w-100 text-center p-3" style="z-index: 3;">
            <div class="mx-auto" style="max-width: 1000px;">
                <h1 class="display-4 fw-bold text-white mb-4" style="line-height: 1.4; letter-spacing: 0.05em;">
                    Programmable Lipid Membrane Remodeling Using HCR and Anchored DNA
                </h1>
                <p class="fs-5 tracking-widest fw-bold" style="color: var(--accent-blue);">BIOMOD 2026 - Team Science Tokyo</p>
            </div>
        </div>
    </header>

    <main class="w-100 overflow-hidden">
        <section class="fade-in-section" style="padding-top: 100px; padding-bottom: 100px; background-color: #ffffff;">
            <div class="container px-3 px-md-0" style="max-width: 1000px;">
                <!-- 新しい見出しデザイン -->
                <h2 class="h3 section-title mb-5">Abstract</h2>
                
                <div class="mx-auto text-start" style="max-width: 850px;">
                    <p class="fs-5 text-secondary mb-4" style="line-height: 1.9;">
                        text
                    </p>
                </div>
            </div>
        </section>
    </main>

    <!-- フッター読み込み位置 -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
