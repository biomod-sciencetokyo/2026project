<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 隠しページ：TEAM ページの姫をタップした人だけが来られる（メニューには載せない） -->
    <meta name="robots" content="noindex">
    <title>miRNA PRINCESS | BIOMOD 2026 Team Science Tokyo</title>
    <link rel="icon" type="image/png" sizes="32x32" href="img/team_favicon_32.png?v=3">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20261114-9">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body tabindex="0">

    <div class="ambient-particles" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <div id="header-placeholder"></div>

    <main class="container content-container px-3 px-md-0">

        <div class="text-center mb-5 pb-4">
            <h1 class="page-title">miRNA PRINCESS</h1>
            <div class="page-title-underline"></div>
            <p class="text-secondary mt-4 mb-0">You found the secret room!</p>
        </div>

        <!-- プロフィール -->
        <section class="fade-in-section mb-5">
            <div class="content-box">
                <div class="row g-4 align-items-center">
                    <div class="col-md-5 text-center">
                        <img src="img/mascot/princess_wave.gif" alt="miRNA Princess waving" class="princess-hero-img">
                    </div>
                    <div class="col-md-7">
                        <dl class="princess-profile mb-0">
                            <dt>NAME</dt>
                            <dd>miRNA Princess</dd>
                            <dt>ROLE</dt>
                            <dd>Mascot of Team Science Tokyo</dd>
                            <dt>FAVORITE THING</dt>
                            <dd>Bundled HCR</dd>
                            <dt>MESSAGE</dt>
                            <dd class="mb-0">Thank you for visiting our wiki all the way to the end!</dd>
                        </dl>
                    </div>
                </div>
            </div>
        </section>

        <!-- ポーズ集 -->
        <section class="fade-in-section mb-5">
            <h2 class="h3 section-title">Royal Gallery</h2>
            <div class="row g-4 mt-2 text-center">
                <figure class="princess-pose col-6 col-md-3 mb-0">
                    <img src="img/mascot/princess_wave.gif" alt="Princess waving" loading="lazy">
                    <figcaption>Hello!</figcaption>
                </figure>
                <figure class="princess-pose col-6 col-md-3 mb-0">
                    <img src="img/mascot/princess_step.gif" alt="Princess stepping in place" loading="lazy">
                    <figcaption>Step</figcaption>
                </figure>
                <figure class="princess-pose col-6 col-md-3 mb-0">
                    <img src="img/mascot/princess_jump.gif" alt="Princess jumping" loading="lazy">
                    <figcaption>Jump</figcaption>
                </figure>
                <figure class="princess-pose col-6 col-md-3 mb-0">
                    <img src="img/mascot/princess_look.gif" alt="Princess looking around" loading="lazy">
                    <figcaption>Look around</figcaption>
                </figure>
                <figure class="princess-pose col-6 col-md-3 mb-0">
                    <img src="img/mascot/princess_sway.gif" alt="Princess swaying" loading="lazy">
                    <figcaption>Sway</figcaption>
                </figure>
                <figure class="princess-pose col-6 col-md-3 mb-0">
                    <img src="img/mascot/princess_turn.gif" alt="Princess turning around" loading="lazy"
                        style="padding: 10%;">
                    <figcaption>Turn</figcaption>
                </figure>
                <figure class="princess-pose col-6 col-md-3 mb-0">
                    <img src="img/mascot/princess_handstand.gif" alt="Princess doing a handstand" loading="lazy">
                    <figcaption>Handstand</figcaption>
                </figure>
            </div>
        </section>

        <div class="text-center mb-5">
            <a href="team.html" class="btn btn-outline-light">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to TEAM
            </a>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js?v=20261113-19"></script>
</body>

</html>
